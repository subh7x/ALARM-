<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/favicon-32.png"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="stylesheet" href="./style.css"><title>Alarm Clock</title></head><body><main>
<header><div class="brand"><img src="./assets/logo.png"><div><small>ALARM CLOCK</small><h1>Good <span id="greeting">day</span></h1></div></div><button id="theme">☾</button></header>
<section class="clock"><div id="time">00:00</div><b id="sec">00</b><strong id="ampm">AM</strong><p id="date"></p></section>
<div class="head"><div><h2>Your alarms</h2><small id="count">0 alarms</small></div><button id="add">＋ Add Alarm</button></div>
<section id="list"></section><div id="empty">⏰<h3>No alarms yet</h3><p>Create your first alarm.</p></div>
<dialog id="dlg"><form id="form"><h2>Add alarm</h2><input id="at" type="time" required><input id="label" placeholder="Wake up"><select id="repeat"><option value="once">Once</option><option value="daily">Daily</option><option value="weekdays">Weekdays</option><option value="weekends">Weekends</option></select><div><button type="button" id="cancel">Cancel</button><button>Save</button></div></form></dialog>
<div id="ring" hidden><div class="ringbox"><img src="./assets/logo.png"><h2 id="rt">07:00</h2><p id="rl">Alarm</p><button id="snooze">Snooze 5 min</button><button id="stop">Stop</button></div></div>
<audio id="audio" src="./assets/alarm-ringtone.wav" preload="auto" loop></audio></main><script src="./script.js"></script></body></html>
