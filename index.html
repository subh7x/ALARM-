<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="A clean, minimalist alarm clock Progressive Web App.">
  <title>Alarm Clock</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ALARM CLOCK</p>
        <h1>Good <span id="greeting">day</span></h1>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">☾</button>
    </header>

    <section class="clock-card" aria-label="Current time">
      <div id="clock" class="clock">00:00</div>
      <div id="seconds" class="seconds">00</div>
      <div id="ampm" class="ampm">AM</div>
      <p id="date" class="date">Loading date…</p>
    </section>

    <section class="section-head">
      <div>
        <h2>Your alarms</h2>
        <p id="alarmCount">0 alarms</p>
      </div>
      <button id="addAlarmBtn" class="primary-btn">＋ Add Alarm</button>
    </section>

    <section id="alarmList" class="alarm-list" aria-live="polite"></section>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon">⏰</div>
      <h3>No alarms yet</h3>
      <p>Create your first alarm to get started.</p>
    </div>

    <section class="install-card" id="installCard" hidden>
      <div>
        <strong>Install Alarm Clock</strong>
        <p>Add it to your home screen for a native app-like experience.</p>
      </div>
      <button id="installBtn" class="secondary-btn">Install</button>
    </section>

    <footer>Alarm Clock • Works offline</footer>
  </main>

  <dialog id="alarmDialog">
    <form id="alarmForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <p class="eyebrow">NEW ALARM</p>
          <h2 id="dialogTitle">Add alarm</h2>
        </div>
        <button type="button" id="closeDialog" class="icon-btn">×</button>
      </div>

      <label class="field-label" for="alarmTime">Time</label>
      <input id="alarmTime" type="time" required>

      <label class="field-label" for="alarmLabel">Label</label>
      <input id="alarmLabel" type="text" maxlength="40" placeholder="Wake up">

      <fieldset>
        <legend>Repeat</legend>
        <div class="repeat-grid">
          <label class="repeat-option"><input type="radio" name="repeat" value="once" checked> <span>Once</span></label>
          <label class="repeat-option"><input type="radio" name="repeat" value="daily"> <span>Daily</span></label>
          <label class="repeat-option"><input type="radio" name="repeat" value="weekdays"> <span>Weekdays</span></label>
          <label class="repeat-option"><input type="radio" name="repeat" value="weekends"> <span>Weekends</span></label>
        </div>
      </fieldset>

      <div class="dialog-actions">
        <button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save Alarm</button>
      </div>
    </form>
  </dialog>

  <div id="alarmOverlay" class="alarm-overlay" hidden>
    <div class="ring-card">
      <div class="ring-icon">⏰</div>
      <p class="eyebrow">ALARM</p>
      <h2 id="ringTime">07:00</h2>
      <p id="ringLabel">Wake up</p>
      <div class="ring-actions">
        <button id="snoozeBtn" class="secondary-btn">Snooze 5 min</button>
        <button id="stopBtn" class="primary-btn">Stop</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
